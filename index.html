<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZTRACK Temperature Monitoring Platform</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ztrack_theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        } catch (e) {}
        // Evita quedarse en /reefer (sin slash): la SPA vive en /reefer/
        try {
          var p = location.pathname;
          if (p === '/reefer') {
            location.replace('/reefer/' + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
